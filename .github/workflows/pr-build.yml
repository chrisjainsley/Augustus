name: PR Build & Test

on:
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened ]

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.dotnet-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net6.0
            dotnet-version: '6.0.x'
          - framework: net7.0
            dotnet-version: '7.0.x'
          - framework: net8.0
            dotnet-version: '8.0.x'
          - framework: net9.0
            dotnet-version: '9.0.x'
          - framework: net10.0
            dotnet-version: '10.0.x'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore Augustus/Augustus.Tests/Augustus.Tests.csproj

      - name: Build
        run: dotnet build Augustus/Augustus.Tests/Augustus.Tests.csproj --configuration Release --no-restore --framework ${{ matrix.framework }}

      - name: Run tests
        run: dotnet test Augustus/Augustus.Tests/Augustus.Tests.csproj --configuration Release --no-build --verbosity normal --framework ${{ matrix.framework }} --logger "trx;LogFileName=test-results-${{ matrix.framework }}.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.framework }}
          path: '**/*.trx'
          if-no-files-found: ignore

  cross-platform-cache-key-tests:
    name: Cross-platform cache key tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Augustus/Augustus.Tests/Augustus.Tests.csproj

      - name: Build
        run: dotnet build Augustus/Augustus.Tests/Augustus.Tests.csproj --configuration Release --no-restore --framework net8.0

      - name: Run cache key tests
        run: dotnet test Augustus/Augustus.Tests/Augustus.Tests.csproj --configuration Release --no-build --verbosity normal --framework net8.0 --filter "FullyQualifiedName~CacheKey" --logger "trx;LogFileName=cache-key-tests-${{ matrix.os }}.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-key-tests-${{ matrix.os }}
          path: '**/*.trx'
          if-no-files-found: ignore

  stripe-sample:
    name: Stripe sample (cache-only, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      AUGUSTUS_STRIPE_SAMPLE_CI_CACHE_ONLY: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore Augustus/samples/Augustus.Sample.StripeApi.Tests/Augustus.Sample.StripeApi.Tests.csproj

      - name: Build
        run: dotnet build Augustus/samples/Augustus.Sample.StripeApi.Tests/Augustus.Sample.StripeApi.Tests.csproj --configuration Release --no-restore

      - name: Run Stripe sample tests
        run: dotnet test Augustus/samples/Augustus.Sample.StripeApi.Tests/Augustus.Sample.StripeApi.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=stripe-sample-${{ matrix.os }}.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stripe-sample-${{ matrix.os }}
          path: '**/*.trx'
          if-no-files-found: ignore

  reqnroll-tests:
    name: Reqnroll Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore Augustus/Augustus.Reqnroll.Tests/Augustus.Reqnroll.Tests.csproj

      - name: Build
        run: dotnet build Augustus/Augustus.Reqnroll.Tests/Augustus.Reqnroll.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Augustus/Augustus.Reqnroll.Tests/Augustus.Reqnroll.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=reqnroll-test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reqnroll-test-results
          path: '**/*.trx'
          if-no-files-found: ignore
