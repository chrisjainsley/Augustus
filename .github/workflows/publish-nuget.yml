name: Publish NuGet Package

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Extract version from release tag
        id: version
        run: |
          # Extract version from tag (v1.2.3 or v1.2.3-alpha -> 1.2.3 or 1.2.3-alpha)
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix if present
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

      - name: Restore dependencies
        run: |
          dotnet restore Augustus/Augustus/Augustus.csproj
          dotnet restore Augustus/Augustus.Reqnroll/Augustus.Reqnroll.csproj
          dotnet restore Augustus/Augustus.Tests/Augustus.Tests.csproj
          dotnet restore Augustus/Augustus.Reqnroll.Tests/Augustus.Reqnroll.Tests.csproj

      - name: Build
        run: |
          dotnet build Augustus/Augustus/Augustus.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build Augustus/Augustus.Reqnroll/Augustus.Reqnroll.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build Augustus/Augustus.Tests/Augustus.Tests.csproj --configuration Release --no-restore
          dotnet build Augustus/Augustus.Reqnroll.Tests/Augustus.Reqnroll.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: |
          dotnet test Augustus/Augustus.Tests/Augustus.Tests.csproj --configuration Release --no-build --verbosity normal
          dotnet test Augustus/Augustus.Reqnroll.Tests/Augustus.Reqnroll.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack NuGet packages
        run: |
          dotnet pack Augustus/Augustus/Augustus.csproj --configuration Release --no-build --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}
          dotnet pack Augustus/Augustus.Reqnroll/Augustus.Reqnroll.csproj --configuration Release --no-build --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Verify package versions
        run: |
          EXPECTED_VERSION="${{ steps.version.outputs.VERSION }}"
          NUPKG_COUNT=$(find ./nupkg -name "*.nupkg" -type f | wc -l)
          if [[ "$NUPKG_COUNT" -eq 0 ]]; then
            echo "::error::No .nupkg files found in ./nupkg"
            exit 1
          fi
          echo "Found $NUPKG_COUNT package(s). Expected version: $EXPECTED_VERSION"
          FAILED=0
          for NUPKG in $(find ./nupkg -name "*.nupkg" -type f); do
            NUPKG_NAME=$(basename "$NUPKG")
            echo "Checking: $NUPKG_NAME"
            if [[ "$NUPKG_NAME" != *"${EXPECTED_VERSION}.nupkg" ]]; then
              echo "::error::Version mismatch! Package '$NUPKG_NAME' does not contain expected version '$EXPECTED_VERSION'"
              FAILED=1
            fi
          done
          if [[ "$FAILED" -eq 1 ]]; then
            exit 1
          fi
          echo "All package versions verified successfully."

      - name: Publish to NuGet.org
        run: |
          for NUPKG in ./nupkg/*.nupkg; do
            echo "Publishing package: $NUPKG"
            dotnet nuget push "$NUPKG" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./nupkg/*.nupkg
            ./nupkg/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release notes
        run: |
          echo "✅ Successfully published Augustus.AI and Augustus.AI.Reqnroll version ${{ steps.version.outputs.VERSION }} to NuGet.org"
          echo "📦 Augustus.AI: https://www.nuget.org/packages/Augustus.AI/${{ steps.version.outputs.VERSION }}"
          echo "📦 Augustus.AI.Reqnroll: https://www.nuget.org/packages/Augustus.AI.Reqnroll/${{ steps.version.outputs.VERSION }}"
