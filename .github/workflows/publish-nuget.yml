name: Publish NuGet Package

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version from release tag
        id: version
        run: |
          # Extract version from tag (v1.2.3 or v1.2.3-alpha -> 1.2.3 or 1.2.3-alpha)
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix if present
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

      - name: Restore dependencies
        run: |
          dotnet restore Augustus/Augustus/Augustus.csproj
          dotnet restore Augustus/Augustus.Reqnroll/Augustus.Reqnroll.csproj

      - name: Build
        run: |
          dotnet build Augustus/Augustus/Augustus.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build Augustus/Augustus.Reqnroll/Augustus.Reqnroll.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack NuGet packages
        run: |
          dotnet pack Augustus/Augustus/Augustus.csproj --configuration Release --no-build --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}
          dotnet pack Augustus/Augustus.Reqnroll/Augustus.Reqnroll.csproj --configuration Release --no-build --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Publish to NuGet.org
        run: |
          for NUPKG in ./nupkg/*.nupkg; do
            echo "Publishing package: $NUPKG"
            dotnet nuget push "$NUPKG" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./nupkg/*.nupkg
            ./nupkg/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release notes
        run: |
          echo "✅ Successfully published Augustus.AI and Augustus.AI.Reqnroll version ${{ steps.version.outputs.VERSION }} to NuGet.org"
          echo "📦 Augustus.AI: https://www.nuget.org/packages/Augustus.AI/${{ steps.version.outputs.VERSION }}"
          echo "📦 Augustus.AI.Reqnroll: https://www.nuget.org/packages/Augustus.AI.Reqnroll/${{ steps.version.outputs.VERSION }}"
