name: Publish NuGet Package

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from release tag
        id: version
        run: |
          # Extract version from tag (v1.2.3 or v1.2.3-alpha -> 1.2.3 or 1.2.3-alpha)
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix if present
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

      - name: Restore dependencies
        run: |
          dotnet restore Augustus/Augustus/Augustus.csproj
          dotnet restore Augustus/Augustus.Tests/Augustus.Tests.csproj

      - name: Build
        run: |
          dotnet build Augustus/Augustus/Augustus.csproj --configuration Release --no-restore /p:Version=${{ steps.version.outputs.VERSION }}
          dotnet build Augustus/Augustus.Tests/Augustus.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Augustus/Augustus.Tests/Augustus.Tests.csproj --configuration Release --no-build --verbosity normal --framework net10.0

      - name: Pack NuGet package
        run: dotnet pack Augustus/Augustus/Augustus.csproj --configuration Release --no-build --output ./nupkg /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Verify package version
        run: |
          EXPECTED_VERSION="${{ steps.version.outputs.VERSION }}"
          NUPKG_COUNT=$(find ./nupkg -name "*.nupkg" -type f | wc -l)
          if [[ "$NUPKG_COUNT" -eq 0 ]]; then
            echo "::error::No .nupkg files found in ./nupkg"
            exit 1
          fi
          if [[ "$NUPKG_COUNT" -gt 1 ]]; then
            echo "::error::Expected exactly 1 .nupkg file but found $NUPKG_COUNT:"
            find ./nupkg -name "*.nupkg" -type f
            exit 1
          fi
          NUPKG=$(find ./nupkg -name "*.nupkg" -type f)
          NUPKG_NAME=$(basename "$NUPKG")
          echo "Package file: $NUPKG_NAME"
          echo "Expected version: $EXPECTED_VERSION"
          if [[ "$NUPKG_NAME" != *"${EXPECTED_VERSION}.nupkg" ]]; then
            echo "::error::Version mismatch! Package '$NUPKG_NAME' does not contain expected version '$EXPECTED_VERSION'"
            exit 1
          fi
          echo "Version verified successfully."

      - name: Publish to NuGet.org
        run: |
          NUPKG=$(find ./nupkg -name "*.nupkg" -type f | head -1)
          echo "Publishing package: $NUPKG"
          dotnet nuget push "$NUPKG" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./nupkg/*.nupkg
            ./nupkg/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release notes
        run: |
          echo "✅ Successfully published Augustus.AI version ${{ steps.version.outputs.VERSION }} to NuGet.org"
          echo "📦 Package: https://www.nuget.org/packages/Augustus.AI/${{ steps.version.outputs.VERSION }}"
